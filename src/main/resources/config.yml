# ============================================================
#  PasseJogo - configuracao
# ============================================================

# Conta tempo so de quem esta ATIVO: andou, quebrou bloco, falou no chat
# ou usou comando nos ultimos X minutos. 0 = conta tudo (inclusive AFK).
afk-minutos: 5

# Comando que o CONSOLE executa para cada tipo de recompensa.
#   %player% = nick de quem ganhou     %valor% = quantidade
comandos:
  # >>> TROQUE pelo comando do plugin de cash do seu servidor <<<
  cash: "points give %player% %valor%"
  dinheiro: "eco give %player% %valor%"
  chave-basica: "crazycrate give physical basica %valor% %player%"
# "xp-pontos" e "xp-niveis" o proprio plugin entrega (nao precisa de comando).

# Como cada recompensa aparece no menu.
nomes:
  cash: "&a%valor% Cash"
  dinheiro: "&6$%valor%"
  xp-pontos: "&b%valor% pontos de XP"
  xp-niveis: "&b%valor% niveis de XP"
  chave-basica: "&d%valor%x Chave Basica"

# Niveis do passe. "minutos" = tempo de jogo TOTAL necessario.
# Voce pode adicionar/remover niveis e usar qualquer tipo acima.
# Para um comando solto, use "comandos-extra:" (lista) dentro do nivel.
# (maximo de 45 niveis no menu)
